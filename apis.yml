name: Mathem
description: >-
  Mathem is Sweden's largest pure-play online grocery retailer, delivering
  fresh food, household goods and pantry staples directly to consumers' homes
  across Sweden. Customers browse and order the full assortment of a physical
  supermarket through the mathem.se website and native iOS/Android apps, and
  receive scheduled home delivery. Mathem merged with the Norwegian online
  grocer Oda to form one of the Nordics' largest online grocery groups, and its
  security and careers functions are now operated under the shared Oda
  organization. Payments are handled through Klarna and the major card networks.
  Mathem operates a consumer e-commerce storefront and mobile apps; it does not
  publish a public developer API, SDKs, or a developer portal. This API
  Evangelist profile was created as a SoftBank Vision Fund portfolio lead and
  enriched via the enrichment pipeline; the substantive public technical surface
  found is an RFC 9116 security.txt and an invite-only YesWeHack bug-bounty
  program run through Oda.
